services:
  backend:
    build: ./backend
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - PORT=3000
      - SEED_DEMO=true
      - SEED_REPORTS=5000
      - SEED_CLEAR=false
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
      - db
      - minio
    environment:
      - SEED_DEMO=true
      - SEED_REPORTS=5000
      - SEED_CLEAR=false
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    # command: npm run dev -- --host

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d

  db:
    image: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: app_db
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
  dns:
    image: jpillora/dnsmasq
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      HTTP_USER: admin
      HTTP_PASS: admin
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf
    restart: always
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web Dashboard Port
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web Dashboard Port
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  mongo_data:
  minio_data:

# docker compose up --build
# docker compose down -v   (para bajar volumen tambien)
