services:

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
      - db
    environment:
      # ═══════════════════════════════════════════════════════════════════
      # SEED DEMO - Generador de Datos de Demostración
      # ═══════════════════════════════════════════════════════════════════
      # Descomenta las siguientes líneas para generar datos de demostración
      # al iniciar el servidor. Ver backend/SEED_README.md para más info.
      # ───────────────────────────────────────────────────────────────────
      # - SEED_DEMO=true              # Activar generación de datos demo
      # - SEED_REPORTS=5000           # Cantidad de reportes (default: 5000)
      # - SEED_CLEAR=false            # Limpiar datos existentes (default: false)
      # ───────────────────────────────────────────────────────────────────
      # Ejemplos de uso:
      #   - SEED_REPORTS=1000    → Prueba rápida (~10 segundos)
      #   - SEED_REPORTS=5000    → Demo estándar (~30 segundos)
      #   - SEED_REPORTS=10000   → Demo completa (~1 minuto)
      #   - SEED_REPORTS=100000  → Performance test (~10 minutos)
      # ═══════════════════════════════════════════════════════════════════

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    # command: npm run dev -- --host

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d

  db:
    image: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: app_db
      TZ: UTC
      PGTZ: UTC 
    ports:
      - "5432:5432"

volumes:
  mongo_data:

